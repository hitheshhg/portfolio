<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0c" />
      <stop offset="100%" stop-color="#121217" />
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="areaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4ade80" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#4ade80" stop-opacity="0.0" />
    </linearGradient>
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgGrad)" />
  <rect width="800" height="500" fill="url(#gridPattern)" />

  <!-- Metric Badges Top -->
  <g transform="translate(40, 40)">
    <!-- KPI 1 -->
    <rect x="0" y="0" width="220" height="80" rx="12" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)" />
    <text x="20" y="32" fill="#a1a1aa" font-family="monospace" font-size="12">ANNUALIZED CHURN</text>
    <text x="20" y="62" fill="#ffffff" font-family="sans-serif" font-size="24" font-weight="bold">18.4%</text>
    <rect x="130" y="44" width="70" height="22" rx="4" fill="rgba(74,222,128,0.15)" />
    <text x="142" y="59" fill="#4ade80" font-family="monospace" font-size="11" font-weight="bold">-5.8% MoM</text>

    <!-- KPI 2 -->
    <rect x="250" y="0" width="220" height="80" rx="12" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)" />
    <text x="270" y="32" fill="#a1a1aa" font-family="monospace" font-size="12">PREDICTIVE ROC-AUC</text>
    <text x="270" y="62" fill="#38bdf8" font-family="sans-serif" font-size="24" font-weight="bold">0.884</text>
    <text x="360" y="62" fill="#71717a" font-family="monospace" font-size="12">XGBoost</text>

    <!-- KPI 3 -->
    <rect x="500" y="0" width="220" height="80" rx="12" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)" />
    <text x="520" y="32" fill="#a1a1aa" font-family="monospace" font-size="12">REVENUE RETAINED</text>
    <text x="520" y="62" fill="#4ade80" font-family="sans-serif" font-size="24" font-weight="bold">$284,500</text>
  </g>

  <!-- Main Chart Canvas -->
  <g transform="translate(40, 160)">
    <rect width="720" height="300" rx="16" fill="rgba(0,0,0,0.6)" stroke="rgba(255,255,255,0.08)" />

    <!-- Chart Gridlines -->
    <line x1="60" y1="60" x2="680" y2="60" stroke="rgba(255,255,255,0.05)" stroke-dasharray="4 4" />
    <line x1="60" y1="120" x2="680" y2="120" stroke="rgba(255,255,255,0.05)" stroke-dasharray="4 4" />
    <line x1="60" y1="180" x2="680" y2="180" stroke="rgba(255,255,255,0.05)" stroke-dasharray="4 4" />
    <line x1="60" y1="240" x2="680" y2="240" stroke="rgba(255,255,255,0.1)" />

    <!-- Y-axis labels -->
    <text x="45" y="64" fill="#71717a" font-family="monospace" font-size="10" text-anchor="end">100%</text>
    <text x="45" y="124" fill="#71717a" font-family="monospace" font-size="10" text-anchor="end">75%</text>
    <text x="45" y="184" fill="#71717a" font-family="monospace" font-size="10" text-anchor="end">50%</text>
    <text x="45" y="244" fill="#71717a" font-family="monospace" font-size="10" text-anchor="end">25%</text>

    <!-- Retention Area & Line -->
    <path d="M 60 70 C 140 85, 200 110, 280 135 C 360 160, 420 180, 500 195 C 580 205, 630 215, 680 220 L 680 240 L 60 240 Z" fill="url(#areaGrad)" />
    <path d="M 60 70 C 140 85, 200 110, 280 135 C 360 160, 420 180, 500 195 C 580 205, 630 215, 680 220" fill="none" stroke="url(#lineGrad)" stroke-width="3" stroke-linecap="round" />

    <!-- Benchmark Target Line -->
    <path d="M 60 110 C 180 140, 380 200, 680 238" fill="none" stroke="#f43f5e" stroke-width="2" stroke-dasharray="6 6" />

    <!-- Chart Points -->
    <circle cx="280" cy="135" r="5" fill="#38bdf8" stroke="#ffffff" stroke-width="2" />
    <circle cx="500" cy="195" r="5" fill="#4ade80" stroke="#ffffff" stroke-width="2" />

    <!-- Legend -->
    <g transform="translate(60, 25)">
      <circle cx="5" cy="5" r="4" fill="#4ade80" />
      <text x="16" y="9" fill="#e4e4e7" font-family="monospace" font-size="11">ML Optimized Retention</text>

      <circle cx="230" cy="5" r="4" fill="#f43f5e" />
      <text x="241" y="9" fill="#a1a1aa" font-family="monospace" font-size="11">Baseline Churn Curve</text>
    </g>

    <!-- X-axis labels -->
    <text x="60" y="265" fill="#71717a" font-family="monospace" font-size="10">M0</text>
    <text x="184" y="265" fill="#71717a" font-family="monospace" font-size="10">M2</text>
    <text x="308" y="265" fill="#71717a" font-family="monospace" font-size="10">M4</text>
    <text x="432" y="265" fill="#71717a" font-family="monospace" font-size="10">M6</text>
    <text x="556" y="265" fill="#71717a" font-family="monospace" font-size="10">M8</text>
    <text x="680" y="265" fill="#71717a" font-family="monospace" font-size="10">M12</text>
  </g>
</svg>
