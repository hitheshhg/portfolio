<svg width="800" height="500" viewBox="0 0 800 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="500" rx="16" fill="#0D1117" />
  <!-- Subtle Grid -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#21262D" stroke-width="1" />
    </pattern>
    <linearGradient id="glow" x1="0" y1="0" x2="800" y2="500" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4F6D4B" stop-opacity="0.35" />
      <stop offset="0.5" stop-color="#3B82F6" stop-opacity="0.2" />
      <stop offset="1" stop-color="#10B981" stop-opacity="0.1" />
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#grid)" />
  <rect width="800" height="500" fill="url(#glow)" />

  {/* Main Dashboard Window */}
  <g transform="translate(60, 50)">
    <rect width="680" height="400" rx="12" fill="#161B22" stroke="#30363D" stroke-width="1.5" />
    {/* Window Header */}
    <rect width="680" height="44" rx="12" fill="#21262D" />
    <circle cx="24" cy="22" r="6" fill="#FF5F56" />
    <circle cx="44" cy="22" r="6" fill="#FFBD2E" />
    <circle cx="64" cy="22" r="6" fill="#27C93F" />
    <text x="340" y="27" fill="#8B949E" font-size="13" font-family="monospace" text-anchor="middle">prepr.io — AI Interview &amp; Resume Intelligence</text>

    {/* Left Column: ATS Resume Parser */}
    <g transform="translate(30, 70)">
      <rect width="280" height="290" rx="10" fill="#0D1117" stroke="#30363D" />
      <text x="20" y="35" fill="#F0F6FC" font-size="15" font-weight="600" font-family="sans-serif">ATS Resume Score</text>
      
      {/* Circular Progress Gauge */}
      <circle cx="140" cy="120" r="55" stroke="#21262D" stroke-width="12" fill="none" />
      <circle cx="140" cy="120" r="55" stroke="#4F6D4B" stroke-width="12" stroke-dasharray="345" stroke-dashoffset="40" stroke-linecap="round" fill="none" />
      <text x="140" y="125" fill="#FFFFFF" font-size="28" font-weight="bold" font-family="sans-serif" text-anchor="middle">94%</text>
      <text x="140" y="145" fill="#8B949E" font-size="11" font-family="sans-serif" text-anchor="middle">ATS Match Rate</text>

      {/* Checklist items */}
      <g transform="translate(20, 195)">
        <rect width="240" height="24" rx="4" fill="#161B22" />
        <circle cx="14" cy="12" r="4" fill="#27C93F" />
        <text x="28" y="16" fill="#C9D1D9" font-size="11" font-family="sans-serif">Tech Keywords: 18/20 matched</text>
      </g>
      <g transform="translate(20, 225)">
        <rect width="240" height="24" rx="4" fill="#161B22" />
        <circle cx="14" cy="12" r="4" fill="#27C93F" />
        <text x="28" y="16" fill="#C9D1D9" font-size="11" font-family="sans-serif">Action Verbs: Strong quantitative proof</text>
      </g>
      <g transform="translate(20, 255)">
        <rect width="240" height="24" rx="4" fill="#161B22" />
        <circle cx="14" cy="12" r="4" fill="#27C93F" />
        <text x="28" y="16" fill="#C9D1D9" font-size="11" font-family="sans-serif">Formatting: 100% Machine-readable</text>
      </g>
    </g>

    {/* Right Column: AI Mock Interview Session */}
    <g transform="translate(340, 70)">
      <rect width="310" height="290" rx="10" fill="#0D1117" stroke="#30363D" />
      <text x="20" y="35" fill="#F0F6FC" font-size="15" font-weight="600" font-family="sans-serif">AI Mock Interview: Tech Round</text>
      
      {/* Question Card */}
      <rect x="20" y="55" width="270" height="70" rx="6" fill="#161B22" stroke="#21262D" />
      <text x="32" y="78" fill="#58A6FF" font-size="10" font-weight="bold" font-family="monospace">SYSTEM QUESTION #04</text>
      <text x="32" y="98" fill="#F0F6FC" font-size="12" font-family="sans-serif">Explain how database indexes improve query</text>
      <text x="32" y="114" fill="#F0F6FC" font-size="12" font-family="sans-serif">performance and their trade-offs.</text>

      {/* Speech waveform */}
      <g transform="translate(20, 145)">
        <rect width="270" height="50" rx="6" fill="#161B22" />
        <text x="14" y="30" fill="#8B949E" font-size="10" font-family="monospace">MIC</text>
        {/* Animated bars */}
        <line x1="50" y1="25" x2="50" y2="15" stroke="#4F6D4B" stroke-width="3" stroke-linecap="round" />
        <line x1="60" y1="35" x2="60" y2="5" stroke="#4F6D4B" stroke-width="3" stroke-linecap="round" />
        <line x1="70" y1="28" x2="70" y2="12" stroke="#4F6D4B" stroke-width="3" stroke-linecap="round" />
        <line x1="80" y1="38" x2="80" y2="2" stroke="#4F6D4B" stroke-width="3" stroke-linecap="round" />
        <line x1="90" y1="30" x2="90" y2="10" stroke="#4F6D4B" stroke-width="3" stroke-linecap="round" />
        <line x1="100" y1="32" x2="100" y2="8" stroke="#4F6D4B" stroke-width="3" stroke-linecap="round" />
        <line x1="110" y1="25" x2="110" y2="15" stroke="#4F6D4B" stroke-width="3" stroke-linecap="round" />
        <line x1="120" y1="35" x2="120" y2="5" stroke="#4F6D4B" stroke-width="3" stroke-linecap="round" />
        <line x1="130" y1="30" x2="130" y2="10" stroke="#4F6D4B" stroke-width="3" stroke-linecap="round" />
        <line x1="140" y1="26" x2="140" y2="14" stroke="#4F6D4B" stroke-width="3" stroke-linecap="round" />
        <line x1="150" y1="32" x2="150" y2="8" stroke="#4F6D4B" stroke-width="3" stroke-linecap="round" />
        <line x1="160" y1="37" x2="160" y2="3" stroke="#4F6D4B" stroke-width="3" stroke-linecap="round" />
        <line x1="170" y1="28" x2="170" y2="12" stroke="#4F6D4B" stroke-width="3" stroke-linecap="round" />
        <text x="210" y="30" fill="#27C93F" font-size="11" font-family="sans-serif">Listening...</text>
      </g>

      {/* Real-time feedback pills */}
      <g transform="translate(20, 215)">
        <rect width="130" height="26" rx="13" fill="#1F2937" />
        <text x="65" y="17" fill="#6EE7B7" font-size="10" font-family="sans-serif" text-anchor="middle">Clarity: 9.2/10</text>
        <rect x="140" width="130" height="26" rx="13" fill="#1F2937" />
        <text x="205" y="17" fill="#93C5FD" font-size="10" font-family="sans-serif" text-anchor="middle">Accuracy: 9.5/10</text>
      </g>
      
      {/* Gamification badge */}
      <g transform="translate(20, 252)">
        <rect width="270" height="28" rx="6" fill="#4F6D4B" fill-opacity="0.2" stroke="#4F6D4B" stroke-width="1" />
        <text x="135" y="18" fill="#A3C49E" font-size="11" font-weight="600" font-family="sans-serif" text-anchor="middle">🔥 14-Day Placement Prep Streak Active</text>
      </g>
    </g>
  </g>
</svg>
