<svg width="800" height="500" viewBox="0 0 800 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="500" rx="16" fill="#0F172A" />
  <!-- Grid -->
  <defs>
    <pattern id="campus-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="1" />
    </pattern>
    <linearGradient id="android-glow" x1="0" y1="0" x2="800" y2="500" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0284C7" stop-opacity="0.25" />
      <stop offset="0.6" stop-color="#3B82F6" stop-opacity="0.15" />
      <stop offset="1" stop-color="#10B981" stop-opacity="0.1" />
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#campus-grid)" />
  <rect width="800" height="500" fill="url(#android-glow)" />

  {/* Left: Mobile Android Device Frame */}
  <g transform="translate(100, 45)">
    {/* Phone Body */}
    <rect width="260" height="410" rx="28" fill="#18181B" stroke="#3F3F46" stroke-width="3" />
    <rect x="12" y="16" width="236" height="378" rx="20" fill="#09090B" />
    {/* Camera notch */}
    <rect x="95" y="24" width="70" height="14" rx="7" fill="#18181B" />
    
    {/* App Bar */}
    <g transform="translate(24, 46)">
      <text x="0" y="20" fill="#F4F4F5" font-size="16" font-weight="bold" font-family="sans-serif">CampusFix</text>
      <text x="0" y="36" fill="#A1A1AA" font-size="10" font-family="sans-serif">NMAMIT Campus Reporter</text>
      <circle cx="200" cy="18" r="14" fill="#0284C7" fill-opacity="0.2" />
      <circle cx="200" cy="18" r="4" fill="#38BDF8" />
    </g>

    {/* Incident Ticket in App */}
    <g transform="translate(24, 98)">
      <rect width="212" height="120" rx="10" fill="#18181B" stroke="#27272A" />
      {/* Category Tag */}
      <rect x="12" y="12" width="75" height="18" rx="4" fill="#EF4444" fill-opacity="0.15" />
      <text x="49" y="25" fill="#F87171" font-size="9" font-weight="600" font-family="sans-serif" text-anchor="middle">ELECTRICAL</text>
      <text x="175" y="25" fill="#A1A1AA" font-size="9" font-family="monospace">#TKT-412</text>
      
      <text x="12" y="48" fill="#F4F4F5" font-size="12" font-weight="600" font-family="sans-serif">Broken Ceiling Fan</text>
      <text x="12" y="64" fill="#A1A1AA" font-size="10" font-family="sans-serif">Room 304, CSE Academic Block</text>

      {/* Status progression */}
      <g transform="translate(12, 82)">
        <rect width="188" height="24" rx="6" fill="#09090B" />
        <circle cx="20" cy="12" r="5" fill="#10B981" />
        <text x="32" y="16" fill="#34D399" font-size="10" font-weight="600" font-family="sans-serif">Status: Dispatched</text>
        <text x="160" y="16" fill="#A1A1AA" font-size="9" font-family="sans-serif">10m ago</text>
      </g>
    </g>

    {/* Second Incident Ticket */}
    <g transform="translate(24, 230)">
      <rect width="212" height="100" rx="10" fill="#18181B" stroke="#27272A" />
      <rect x="12" y="12" width="55" height="18" rx="4" fill="#3B82F6" fill-opacity="0.15" />
      <text x="39" y="25" fill="#60A5FA" font-size="9" font-weight="600" font-family="sans-serif" text-anchor="middle">WI-FI</text>
      <text x="12" y="48" fill="#F4F4F5" font-size="12" font-weight="600" font-family="sans-serif">AP Offline: 2nd Floor</text>
      <text x="12" y="64" fill="#A1A1AA" font-size="10" font-family="sans-serif">Library Corridor Hub</text>
      <rect x="12" y="74" width="70" height="16" rx="4" fill="#10B981" fill-opacity="0.15" />
      <text x="47" y="86" fill="#34D399" font-size="9" font-weight="600" font-family="sans-serif" text-anchor="middle">✓ RESOLVED</text>
    </g>

    {/* Floating Action Button */}
    <circle cx="200" cy="355" r="22" fill="#0284C7" />
    <text x="200" y="362" fill="#FFFFFF" font-size="20" font-weight="bold" font-family="sans-serif" text-anchor="middle">+</text>
  </g>

  {/* Right: Architectural Dispatch & Metrics */}
  <g transform="translate(400, 65)">
    {/* Card 1: Live Infrastructure Map & Metrics */}
    <rect width="320" height="180" rx="12" fill="#1E293B" stroke="#334155" />
    <text x="24" y="34" fill="#F8FAFC" font-size="15" font-weight="bold" font-family="sans-serif">Campus Issue Tracker Matrix</text>
    <text x="24" y="52" fill="#94A3B8" font-size="11" font-family="sans-serif">Real-time Java + Firebase sync</text>

    {/* Metric boxes */}
    <g transform="translate(24, 75)">
      <rect width="85" height="75" rx="8" fill="#0F172A" />
      <text x="42" y="34" fill="#38BDF8" font-size="22" font-weight="bold" font-family="sans-serif" text-anchor="middle">500+</text>
      <text x="42" y="54" fill="#94A3B8" font-size="10" font-family="sans-serif" text-anchor="middle">Resolved</text>
    </g>
    <g transform="translate(120, 75)">
      <rect width="85" height="75" rx="8" fill="#0F172A" />
      <text x="42" y="34" fill="#34D399" font-size="22" font-weight="bold" font-family="sans-serif" text-anchor="middle">-60%</text>
      <text x="42" y="54" fill="#94A3B8" font-size="10" font-family="sans-serif" text-anchor="middle">Resolution Time</text>
    </g>
    <g transform="translate(216, 75)">
      <rect width="80" height="75" rx="8" fill="#0F172A" />
      <text x="40" y="34" fill="#FCD34D" font-size="22" font-weight="bold" font-family="sans-serif" text-anchor="middle">100%</text>
      <text x="40" y="54" fill="#94A3B8" font-size="10" font-family="sans-serif" text-anchor="middle">Geo-tagged</text>
    </g>

    {/* Card 2: Tech Highlights */}
    <g transform="translate(0, 205)">
      <rect width="320" height="155" rx="12" fill="#1E293B" stroke="#334155" />
      <text x="24" y="32" fill="#F8FAFC" font-size="14" font-weight="600" font-family="sans-serif">Tech Architecture</text>
      
      <g transform="translate(24, 48)">
        <circle cx="8" cy="8" r="4" fill="#38BDF8" />
        <text x="20" y="12" fill="#CBD5E1" font-size="11" font-family="sans-serif">Native Android Java with MVVM pattern</text>
      </g>
      <g transform="translate(24, 76)">
        <circle cx="8" cy="8" r="4" fill="#38BDF8" />
        <text x="20" y="12" fill="#CBD5E1" font-size="11" font-family="sans-serif">Cloud Firestore real-time snapshot listeners</text>
      </g>
      <g transform="translate(24, 104)">
        <circle cx="8" cy="8" r="4" fill="#38BDF8" />
        <text x="20" y="12" fill="#CBD5E1" font-size="11" font-family="sans-serif">Client-side image compression &amp; Storage</text>
      </g>
    </g>
  </g>
</svg>
