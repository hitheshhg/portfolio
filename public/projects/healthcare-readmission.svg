<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0d" />
      <stop offset="100%" stop-color="#14141e" />
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bgGrad3)" />

  <!-- Top Title -->
  <g transform="translate(40, 35)">
    <text x="0" y="20" fill="#a1a1aa" font-family="monospace" font-size="12" letter-spacing="1">MULTIVARIATE LOGISTIC REGRESSION • ODDS RATIOS</text>
    <text x="0" y="48" fill="#ffffff" font-family="sans-serif" font-size="22" font-weight="bold">Clinical Predictors of 30-Day Hospital Readmissions</text>
  </g>

  <!-- Forest Plot Card -->
  <g transform="translate(40, 105)">
    <rect width="720" height="345" rx="16" fill="rgba(0,0,0,0.6)" stroke="rgba(255,255,255,0.08)" />

    <!-- Center Neutral Null Line (OR = 1.0) -->
    <line x1="380" y1="40" x2="380" y2="280" stroke="#f43f5e" stroke-width="1.5" stroke-dasharray="4 4" />
    <text x="380" y="30" fill="#f43f5e" font-family="monospace" font-size="10" text-anchor="middle">Neutral (OR = 1.0)</text>

    <!-- Factor 1: Emergency Admission -->
    <text x="30" y="80" fill="#e4e4e7" font-family="monospace" font-size="12">Emergency Admission</text>
    <text x="210" y="80" fill="#a1a1aa" font-family="monospace" font-size="11">OR: 1.68 [1.48 - 1.91]</text>
    <line x1="440" y1="76" x2="520" y2="76" stroke="#818cf8" stroke-width="2" />
    <rect x="475" y="70" width="12" height="12" rx="2" fill="#818cf8" />
    <text x="640" y="80" fill="#f43f5e" font-family="monospace" font-size="11" font-weight="bold">+68% Risk</text>

    <!-- Factor 2: Length of Stay > 7 Days -->
    <text x="30" y="130" fill="#e4e4e7" font-family="monospace" font-size="12">Inpatient Stay &gt; 7d</text>
    <text x="210" y="130" fill="#a1a1aa" font-family="monospace" font-size="11">OR: 1.42 [1.28 - 1.58]</text>
    <line x1="410" y1="126" x2="475" y2="126" stroke="#818cf8" stroke-width="2" />
    <rect x="440" y="120" width="12" height="12" rx="2" fill="#818cf8" />
    <text x="640" y="130" fill="#f43f5e" font-family="monospace" font-size="11" font-weight="bold">+42% Risk</text>

    <!-- Factor 3: Comorbidities >= 3 -->
    <text x="30" y="180" fill="#e4e4e7" font-family="monospace" font-size="12">Comorbidities &gt;= 3</text>
    <text x="210" y="180" fill="#a1a1aa" font-family="monospace" font-size="11">OR: 1.35 [1.20 - 1.52]</text>
    <line x1="400" y1="176" x2="460" y2="176" stroke="#818cf8" stroke-width="2" />
    <rect x="428" y="170" width="12" height="12" rx="2" fill="#818cf8" />
    <text x="640" y="180" fill="#f43f5e" font-family="monospace" font-size="11" font-weight="bold">+35% Risk</text>

    <!-- Factor 4: Inpatient Med Reconciliation -->
    <text x="30" y="230" fill="#e4e4e7" font-family="monospace" font-size="12">Medication Reconciliation</text>
    <text x="210" y="230" fill="#a1a1aa" font-family="monospace" font-size="11">OR: 0.81 [0.72 - 0.91]</text>
    <line x1="320" y1="226" x2="365" y2="226" stroke="#4ade80" stroke-width="2" />
    <rect x="340" y="220" width="12" height="12" rx="2" fill="#4ade80" />
    <text x="640" y="230" fill="#4ade80" font-family="monospace" font-size="11" font-weight="bold">-19% (Protective)</text>

    <!-- Bottom Stat Bar -->
    <g transform="translate(30, 275)">
      <rect width="660" height="50" rx="10" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.06)" />
      <text x="20" y="30" fill="#38bdf8" font-family="monospace" font-size="12">Cohort: 100k+ Admissions</text>
      <text x="240" y="30" fill="#a1a1aa" font-family="monospace" font-size="12">p-value: &lt; 0.001 (Statistically Significant)</text>
      <text x="560" y="30" fill="#4ade80" font-family="monospace" font-size="12">ROC-AUC: 0.81</text>
    </g>
  </g>
</svg>
